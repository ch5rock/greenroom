<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Training v1</title>

<style>
:root{
  --bg:#0b0d10;
  --text:#e9eef5;
  --muted:#9aa6b2;
  --line:rgba(255,255,255,.1);
  --accent:#8bd3ff;
  --danger:#ff6b6b;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.app{ width:420px; }

.block{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

/* mode */
.modeBtns{
  display:flex;
  gap:10px;
}
.modeBtn{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  cursor:pointer;
}
.modeBtn.active{
  background:#1a2a33;
  border-color:var(--accent);
}

/* timer */
.time{
  font-size:32px;
  font-weight:800;
  text-align:center;
  margin:10px 0;
}

.row{ margin:10px 0; }

.btns{
  display:flex;
  gap:10px;
}
.btn{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  cursor:pointer;
}
.primary{ background:#1a2a33; }

.status{
  font-size:12px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>
<div class="app">

<!-- MODE -->
<div class="block">
  <div class="modeBtns">
    <button class="modeBtn active" id="softBtn">Soft</button>
    <button class="modeBtn" id="hardBtn">Hard</button>
  </div>
</div>

<!-- STATUS -->
<div class="block status">
  <span>Today: <strong id="today">0 min</strong></span>
  <span>Score: <strong id="score">0</strong></span>
</div>

<!-- TIMER -->
<div class="block">
  <div class="time" id="time">00:00</div>

  <div class="row">
    <input type="range" id="range" min="10" max="60" step="5" value="30"/>
  </div>

  <div class="btns">
    <button class="btn primary" id="start">Start</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>

</div>

<script>
let mode="soft";

const softBtn = document.getElementById("softBtn");
const hardBtn = document.getElementById("hardBtn");

softBtn.onclick=()=>{
  mode="soft";
  softBtn.classList.add("active");
  hardBtn.classList.remove("active");
};

hardBtn.onclick=()=>{
  mode="hard";
  hardBtn.classList.add("active");
  softBtn.classList.remove("active");
};

const timeEl = document.getElementById("time");
const startBtn = document.getElementById("start");
const resetBtn = document.getElementById("reset");
const range = document.getElementById("range");
const todayEl = document.getElementById("today");
const scoreEl = document.getElementById("score");

let timer={
  running:false,
  elapsed:0,
  target:1800,
  last:0,
  hidden:false
};

let today=0;
let score=0;

function fmt(t){
  const m=Math.floor(t/60);
  const s=t%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function render(){
  timeEl.textContent=fmt(timer.elapsed);
  startBtn.textContent=timer.running?"Pause":"Start";
  todayEl.textContent=Math.floor(today/60)+" min";
  scoreEl.textContent=score;
}

let tick;

function startTick(){
  clearInterval(tick);
  timer.last=Date.now();

  tick=setInterval(()=>{
    if(!timer.running) return;

    const now=Date.now();
    const d=Math.floor((now-timer.last)/1000);

    if(d>0){
      timer.elapsed=Math.min(timer.target,timer.elapsed+d);
      timer.last=now;
      render();

      if(timer.elapsed>=timer.target){
        timer.running=false;
        clearInterval(tick);

        today+=timer.target;

        // 점수 계산
        score+=Math.floor(timer.target/60)*10;

        render();
      }
    }
  },200);
}

startBtn.onclick=()=>{
  if(!timer.running){
    timer.running=true;
    timer.last=Date.now();
    startTick();
  }else{
    timer.running=false;
  }
  render();
};

resetBtn.onclick=()=>{
  timer.running=false;
  timer.elapsed=0;
  render();
};

range.oninput=()=>{
  timer.target=range.value*60;
};

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(timer.running){
      if(mode==="soft"){
        timer.running=false;
        timer.hidden=true;
      }else{
        // HARD FAIL
        timer.running=false;
        timer.elapsed=0;

        // 패널티
        score=Math.max(0,score-20);

        alert("Hard 모드 실패");
      }
      render();
    }
  }else{
    if(mode==="soft" && timer.hidden){
      timer.running=true;
      timer.last=Date.now();
      startTick();
      timer.hidden=false;
    }
  }
});

render();
</script>

</body>
</html>
